name: Update Marinos Data

on:
  workflow_dispatch: # 手動実行ボタン
  schedule:
    # 毎週水曜・土曜・日曜に自動実行（JST換算）
    # 水曜日: JST 22:00 (UTC 13:00)
    - cron: '0 13 * * 3'
    # 土曜日・日曜日: JST 18:00, 22:00 (UTC 09:00, 13:00)
    - cron: '0 9,13 * * 0,6'

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリをインストール
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: スクリプト実行
        run: python update_points.py

      - name: 変更があればコミットしてプッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update points [skip ci]" && git push origin main)
