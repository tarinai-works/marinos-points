name: Update Marinos Data

on:
  workflow_dispatch: # 手動実行ボタン
  schedule:
    # 毎日 日本時間 18:15（UTC 9:15）と 22:15（UTC 13:15）
    - cron: '15 9,13 * * *'
    
jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリをインストール
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: スクリプト実行
        run: python update_points.py

      - name: 変更があればコミットしてプッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 全ての変更（data.json, data_gamba.json, data_kashima.json など）をステージングに追加
          git add -A
          # 差分がある場合のみコミットとプッシュを実行
          if ! git diff --cached --quiet; then
            git commit -m "Auto update team data [skip ci]"
            git push
          else
            echo "変更はありませんでした。"
          fi
