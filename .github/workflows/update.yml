name: Update Marinos Data

on:
  workflow_dispatch: # 手動実行ボタン
    inputs:
      target_team:
        description: '更新するチームを選択'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - marinos
          - gamba
          - kashima
          - urawa
  schedule:
    # 毎日 日本時間 18:15（UTC 9:15）と 22:15（UTC 13:15）
    - cron: '15 9,13 * * *'
    
jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリをインストール
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: スクリプト実行
        run: |
          # 手動実行時は選択されたチーム、定期実行(cron)時は "all" を指定
          TARGET="${{ github.event.inputs.target_team || 'all' }}"
          echo "Target team: $TARGET"
          python update_points.py --team "$TARGET"

      - name: 変更があればコミットしてプッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            TARGET="${{ github.event.inputs.target_team || 'all' }}"
            git commit -m "Auto update team data [$TARGET] [skip ci]"
            git push
          else
            echo "変更はありませんでした。"
          fi
