name: Update Football Points Data

on:
  workflow_dispatch: # 手動実行のみ
    inputs:
      target_team:
        description: '更新する対象を選択（基本は各チーム、必要な時だけall）'
        required: true
        default: 'marinos'
        type: choice
        options:
          - marinos   # 横浜F・マリノス
          - gamba     # ガンバ大阪
          - kashima   # 鹿島アントラーズ
          - urawa     # 浦和レッズ
          - all       # 全チーム一括手動更新

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリをインストール
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: スクリプト実行
        run: |
          TARGET="${{ github.event.inputs.target_team }}"
          echo "Selected Target: $TARGET"
          python update_points.py --team "$TARGET"

      - name: 変更があればコミットしてプッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            TARGET="${{ github.event.inputs.target_team }}"
            git commit -m "Manual update points data [$TARGET] [skip ci]"
            git push
          else
            echo "変更はありませんでした。"
          fi
